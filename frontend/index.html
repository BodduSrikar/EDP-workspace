<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>📰 Fake News Detector</h1>
        <p class="subtitle">Enter a news article headline or text to predict its authenticity using Machine Learning.</p>

        <textarea id="newsInput" placeholder="Paste your news text or headline here..."></textarea>

        <div class="btn-group">
            <button id="checkBtn" class="btn-primary">🔍 Analyze Article</button>
            <button id="clearBtn" class="btn-secondary">🧹 Clear</button>
        </div>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
